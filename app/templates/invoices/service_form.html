{% extends "base.html" %}
{% block title %}Servicio{% endblock %}
{% block content %}
<h1>{{ "Editar servicio" if service.id else "Nuevo servicio" }}</h1>
<form method="post" action="/servicios/guardar">
  <input type="hidden" name="service_id" value="{{ service.id or '' }}">
  <div class="grid">
    <label>Nombre *<input name="name" value="{{ service.name }}" required placeholder="ej. Luz casa"></label>
    <label>Empresa <input name="provider" value="{{ service.provider }}" placeholder="ej. Edenor"></label>
    <label>Categoría
      <select name="category">{% for c in INVOICE_CATEGORIES %}<option {{ 'selected' if c == service.category }}>{{ c }}</option>{% endfor %}</select>
    </label>
  </div>
  <div class="grid">
    <label>Nº de cliente / cuenta <input name="account_number" value="{{ service.account_number }}"></label>
    <label>Titular
      <select name="owner_id"><option value="">—</option>
        {% for p in people %}<option value="{{ p.id }}" {{ 'selected' if p.id == service.owner_id }}>{{ p.name }}</option>{% endfor %}
      </select>
    </label>
  </div>
  <div class="grid">
    <label>Frecuencia
      <select name="frequency">{% for f in FREQUENCIES %}<option {{ 'selected' if f == service.frequency }}>{{ f }}</option>{% endfor %}</select>
    </label>
    <label>Día de vencimiento <input name="due_day" type="number" min="1" max="31" value="{{ service.due_day or '' }}"></label>
    <label>Monto estimado <input name="expected_amount" type="number" step="0.01" min="0" value="{{ service.expected_amount or '' }}"></label>
  </div>
  <label><input type="checkbox" name="active" value="1" {{ 'checked' if service.active }}> Activo</label>
  <label>Notas <textarea name="notes" rows="2">{{ service.notes }}</textarea></label>
  <button type="submit">Guardar</button>
</form>
{% endblock %}
