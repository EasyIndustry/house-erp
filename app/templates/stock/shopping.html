{% extends "base.html" %}
{% block title %}Lista de compras{% endblock %}
{% block content %}
<h1>Lista de compras</h1>
<p class="muted">Productos por debajo de su stock mínimo.</p>
<div class="list" id="shopping">
  {% for item in items %}
    <label class="item">
      <input type="checkbox">
      <span class="grow"><span class="title">{{ item.product.name }}</span><span class="sub">{{ item.product.brand }} · hay {{ item.product.stock|qty }}</span></span>
      <span class="right big" data-line="- {{ item.product.name }}: {{ item.to_buy|qty }} {{ item.product.unit }}">{{ item.to_buy|qty }} {{ item.product.unit }}</span>
    </label>
  {% else %}<p class="muted">No falta nada 🎉</p>{% endfor %}
</div>
{% if items %}
<button class="secondary outline" onclick="const t=[...document.querySelectorAll('[data-line]')].map(e=>e.dataset.line).join('\n'); navigator.share ? navigator.share({text: 'Lista de compras\n' + t}) : navigator.clipboard.writeText(t).then(() => alert('Lista copiada'))">Compartir lista</button>
{% endif %}
{% endblock %}
